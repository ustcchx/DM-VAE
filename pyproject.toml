[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dm-vae"
version = "0.1.0"
description = "Dual-Manifold Variational Autoencoders for image reconstruction and latent diffusion"
readme = "README.md"
license-files = ["third_party/*-LICENSE"]
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24", "Pillow>=9.1", "safetensors>=0.4"]

[project.optional-dependencies]
hub = ["huggingface-hub>=0.34"]
train = ["torchvision>=0.19", "lpips>=0.1.4"]

[project.urls]
Project = "https://ustcchx.github.io/DM-VAE-page/"

[tool.setuptools.packages.find]
include = ["dmvae*", "generation*", "training*", "evaluation*"]
namespaces = false

[tool.setuptools.package-data]
dmvae = ["weights.json"]
generation = ["configs/*.json"]
